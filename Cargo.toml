[package]
name = "sys-pulse-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.40"
nvml-wrapper = "0.13"
